name: MakaanX quality checks
on:
  pull_request:
  push:
    branches: [main, milestone-1-2-authentication]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (zero warnings)
        run: npm run lint -- --max-warnings=0
      - name: Regression tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-only
        run: npm run build
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated PostgreSQL authorization and concurrency tests
        run: node scripts/local-db/run.cjs
      - name: Upload bounded local database results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-postgresql-results
          path: work/local-db-results.json
          if-no-files-found: ignore
